name: Publish

# Runs when a GitHub release is published (tag vX.Y.Z). Uploads to PyPI via Trusted
# Publishing: no API token is stored; PyPI trusts this workflow in the environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/aiocontrome
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      # Pinned for the same reason as in ci.yml.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"

      # Safety net: never publish a package whose version does not match the tag.
      - name: Check version against tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(uv version --short)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match the package version ${VERSION}"
            exit 1
          fi

      - run: uv build
      - run: uv publish --trusted-publishing always
