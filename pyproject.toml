[project]
name = "aiocontrome"
version = "0.3.0"
description = "Async client for the local HTTP API of Controme Smart-Heat"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  # IANA time zones for the tests on Windows (no system database); not a runtime dependency.
  "tzdata",
]

[project.urls]
Source = "https://github.com/astrometeo84/aiocontrome"
Issues = "https://github.com/astrometeo84/aiocontrome/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests against a real Mini-Server never run by default (CI, container); see docs/LIVE_TESTS.md.
addopts = '--cov=aiocontrome --cov-report=term-missing -m "not live"'
markers = [
  "live: talks to a real Controme Mini-Server; opt-in only (CONTROME_LIVE=1, see docs/LIVE_TESTS.md)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
