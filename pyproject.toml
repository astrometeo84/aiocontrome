[project]
name = "aiocontrome"
version = "0.1.0"
description = "Async client for the local HTTP API of Controme Smart-Heat"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.urls]
Source = "https://github.com/astrometeo84/aiocontrome"
Issues = "https://github.com/astrometeo84/aiocontrome/issues"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=aiocontrome --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
